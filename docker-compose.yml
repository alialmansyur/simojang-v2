name: simojang-v2

networks:
  appnet:
    driver: bridge

volumes:
  simojang_v2_writable:

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        - VITE_BASE_PATH=${VITE_BASE_PATH:-/simojang-dev/}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/simojang-api}
    container_name: simojang-v2-nginx
    restart: unless-stopped
    ports:
      - "${FE_PORT:-8401}:80"
      - "${BE_PORT:-8402}:8080"
    volumes:
      - simojang_v2_writable:/var/www/html/writable:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - appnet
    environment:
      - TZ=Asia/Jakarta
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simojang-v2-app
    restart: unless-stopped
    env_file:
      - ./apps/admin/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/admin/.env:/var/www/html/.env
      - simojang_v2_writable:/var/www/html/writable
    environment:
      - TZ=Asia/Jakarta
      - CI_ENVIRONMENT=${CI_ENVIRONMENT:-production}
    networks:
      - appnet
