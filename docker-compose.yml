name: simojang-v2

networks:
  appnet:
    external: true
    name: simojang_appnet

volumes:
  simojang_v2_writable:

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        - VITE_BASE_PATH=${VITE_BASE_PATH:-/}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    container_name: simojang-v2-nginx
    restart: unless-stopped
    ports:
      - "${FE_PORT:-8401}:80"
      - "${BE_PORT:-8402}:8080"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - simojang_v2_writable:/var/www/html/writable:ro
      - ./apps/admin/writable/uploads:/var/www/html/writable/uploads:ro
    depends_on:
      app_v2:
        condition: service_started
    networks:
      - appnet
    environment:
      - TZ=Asia/Jakarta
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  app_v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simojang-v2-app
    restart: unless-stopped
    env_file:
      - ./apps/admin/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/admin/.env:/var/www/html/.env
      - ./apps/admin/app:/var/www/html/app
      - simojang_v2_writable:/var/www/html/writable
      - ./apps/admin/writable/uploads:/var/www/html/writable/uploads
    environment:
      - TZ=Asia/Jakarta
      - CI_ENVIRONMENT=${CI_ENVIRONMENT:-production}
    networks:
      appnet:
        aliases:
          - app_v2
