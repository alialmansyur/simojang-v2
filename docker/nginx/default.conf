# ========================================================
# SERVER 1: FRONTEND REACT SPA + API PROXY (Host: 8401 -> Port 80)
# ========================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/frontend;
    index index.html;

    client_max_body_size 50M;
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Kompresi Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 1. Blokir file tersembunyi
    location ~ /\. {
        deny all;
    }

    # 1b. Static root files (logo.png, robots.txt, favicon.ico, kop_surat.png)
    location ~* ^/(simojang-dev|simojang)/(logo\.png|kop_surat\.png|favicon\.ico|robots\.txt)$ {
        alias /usr/share/nginx/frontend/$2;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 2. Aset statis build Vite (mendukung root /, /simojang-dev/, dan /simojang/)
    location ^~ /simojang-dev/assets/ {
        alias /usr/share/nginx/frontend/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /simojang/assets/ {
        alias /usr/share/nginx/frontend/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 3. Template Excel frontend
    location ^~ /simojang-dev/templates/ {
        alias /usr/share/nginx/frontend/templates/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /simojang/templates/ {
        alias /usr/share/nginx/frontend/templates/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /templates/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 4. File upload publik
    location ^~ /simojang-dev/media/ {
        alias /var/www/html/writable/uploads/public/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /simojang/media/ {
        alias /var/www/html/writable/uploads/public/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /media/ {
        alias /var/www/html/writable/uploads/public/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 5. Aset statis backend
    location ^~ /apps/assets/ {
        alias /var/www/html/public/apps/assets/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 6. Endpoint API Galeri Kegiatan (SPA route /activity-gallery tetap ke index.html)
    location ~ ^/activity-gallery/(get-data|get-timkerja|get-layanan|store|delete)$ {
        try_files /nonexistent @ci4;
    }

    # 7. Endpoint Backend CodeIgniter 4
    location ~ ^/(api|fetch|store|kill|authprocess|auth|fetch-layanan-enrolled|store-enroll|apps-manage-assets-detail|apps-pnbp|apps-karier|apps-kompetensi|instansi-list|status-data|step-mt-list|step-integrasi-list|select2|select2-struktur-anggaran|download|export|exportXlsxTable|pnbp-sign|pnbp-verify|pnbp-diagnose|uploadAvatar|audit)(/|$) {
        try_files /nonexistent @ci4;
    }

    # 8. FastCGI bridge ke container PHP-FPM CI4 (app:9000)
    location @ci4 {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_pass app:9000;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    # 9. SPA Fallback untuk /simojang-dev/ dan /simojang/
    location /simojang-dev/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location /simojang/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # 10. SPA Frontend fallback (akses root http://localhost:8401/)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}

# ========================================================
# SERVER 2: BACKEND STANDALONE API CI4 (Host: 8402 -> Port 8080)
# ========================================================
server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 50M;
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Kompresi Gzip untuk JSON API
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml;

    # 1. Blokir akses ke file tersembunyi
    location ~ /\. {
        deny all;
    }

    # 2. File upload dinamis milik Backend CI4
    location ^~ /media/ {
        alias /var/www/html/writable/uploads/public/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 3. Aset statis backend (logo instansi / pnbp-sign.js)
    location ^~ /apps/assets/ {
        alias /var/www/html/public/apps/assets/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 4. Router API CodeIgniter 4
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # 5. FastCGI bridge ke container PHP-FPM CI4 (app:9000)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_pass app:9000;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }
}
